services:
  casterpak:
    build:
      context: .
      args:
        # Passed through to the Dockerfile's ARG of the same name, which
        # bakes it into the image as ENV CASTERPAK_VERSION - that's what the
        # running app reads (see vodhls/master_manifest.py). Reads from the
        # VERSION file via CASTERPAK_VERSION in .env - see .env.example.
        # TEMPORARY: until there's a real CI/CD release pipeline, this is
        # manually kept in sync with the VERSION file and the image tag below.
        CASTERPAK_VERSION: ${CASTERPAK_VERSION:-0.9.1-alpha}
    image: flipmcf/casterpak:${CASTERPAK_VERSION:-0.9.1-alpha}
    container_name: casterpak_server
    
    # Map the host port 5000 to the container port 5000
    #ports:
    #  - "${APP_PORT:-5000}:5000"
    expose:
      - "5000"  # Expose port 5000 to other containers (like nginx)

    # Environment variables (overrides for your config logic)
    environment:
      - CASTERPAK_APPLICATION_DEBUG=False
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - CASTERPAK_FILESYSTEM_VIDEOPARENTPATH=${CASTERPAK_FILESYSTEM_VIDEOPARENTPATH:-/mnt/data}
      - CASTERPAK_OUTPUT_SERVERNAME=${CASTERPAK_OUTPUT_SERVERNAME:-localhost}
      - CASTERPAK_INPUT_INPUT_TYPE=${CASTERPAK_INPUT_INPUT_TYPE:-filesystem}
      - CASTERPAK_FILESYSTEM_CACHE_INPUT=${CASTERPAK_FILESYSTEM_CACHE_INPUT:-False}
      # Sub-directories of the one Cache Volume mounted below - see
      # docs/Hosting-instructions. Fixed, matching config_example.ini.
      - CASTERPAK_INPUT_VIDEOCACHEPATH=/var/cache/casterpak/video_input
      - CASTERPAK_OUTPUT_SEGMENTPARENTPATH=/var/cache/casterpak/segments
      # This compose stack puts the nginx service in front of casterpak (see the
      # 'nginx' service below), so segment (.ts) delivery via X-Accel-Redirect
      # works, and nginx's X-Forwarded-Proto header is trusted (see ProxyFix in
      # casterpak/__init__.py). Overridable - tests/containertests/run_tests.py
      # recreates the container with this set False to prove that trust is
      # actually gated on it, not just always-on.
      - CASTERPAK_OUTPUT_BEHIND_NGINX=${CASTERPAK_OUTPUT_BEHIND_NGINX:-True}
      # Forces manifest URLs to https regardless of the request's own scheme -
      # off by default (auto-detect via behind_nginx/X-Forwarded-Proto instead).
      # See casterpak/routes.py:get_base_url.
      - CASTERPAK_OUTPUT_USE_HTTPS=${CASTERPAK_OUTPUT_USE_HTTPS:-False}
      - CASTERPAK_DB_PATH=/var/lib/casterpak/data/cacheDB.db
      # Only used when CASTERPAK_INPUT_INPUT_TYPE=s3 - see docs/s3-input.md
      - CASTERPAK_S3_BUCKET=${CASTERPAK_S3_BUCKET:-}
      - CASTERPAK_S3_PREFIX=${CASTERPAK_S3_PREFIX:-}
      - CASTERPAK_S3_REGION=${CASTERPAK_S3_REGION:-us-east-1}
      - CASTERPAK_S3_ENDPOINT_URL=${CASTERPAK_S3_ENDPOINT_URL:-}
      # Gunicorn owns every log destination and '-' means stdout, so this
      # is all of them - cleanup and encoding borrow these handlers rather
      # than opening files of their own.
      - CASTERPAK_LOGGING_ACCESS_LOG=-
      - CASTERPAK_LOGGING_ERROR_LOG=-

    # Volume mappings connect your real files to the container
    volumes:
      # 1. IF YOU ARE USING FILESYSTEM CONFIG for input (recommended)
      # map the local path to source video files (Change left side to your actual path)
      # best placed in .env - run 'setup.sh'
      # your 'host_video_path' on the host system (where docker engine runs) becomes /mnt/data inside casterpak.
      - ${HOST_VIDEO_PATH:-~/Videos}:/mnt/data

      # CasterPak's own cache data (transcodes, input copies, HLS segments) -
      # the one Cache Volume from docs/Hosting-instructions, mounted whole so
      # its video_input/ and segments/ sub-directories land on real storage.
      - ${HOST_CACHE_PATH:-/var/cache/casterpak}:/var/cache/casterpak
      # This is where the database files live that maintain the cache.
      - casterpak_data:/var/lib/casterpak/data

    # Ensures the container restarts automatically if it crashes or if the server restarts
    restart: unless-stopped

  # The library service: user accounts, upload, listing, embed URLs (library/DESIGN.md).
  # Opt-in - `docker compose up` does not start it; `--profile library` does.
  # Same image as casterpak, different command. It is the ONLY service that writes to the
  # video library, so it gets the library volume read-write; casterpak keeps reading it.
  library:
    profiles: ["library"]
    build:
      context: .
      args:
        CASTERPAK_VERSION: ${CASTERPAK_VERSION:-0.9.1-alpha}
    image: flipmcf/casterpak:${CASTERPAK_VERSION:-0.9.1-alpha}
    container_name: casterpak_library
    command: ["gunicorn", "-c", "gunicorn.library.conf.py", "library:create_app()"]
    expose:
      - "5001"
    environment:
      - PYTHONUNBUFFERED=1
      # Required, 32+ chars. Empty on purpose here: the app refuses to start without it.
      - CASTERPAK_LIBRARY_JWT_SECRET=${CASTERPAK_LIBRARY_JWT_SECRET:-}
      - CASTERPAK_LIBRARY_REGISTRATION=${CASTERPAK_LIBRARY_REGISTRATION:-closed}
      - CASTERPAK_LIBRARY_CASTERPAK_URL=${CASTERPAK_LIBRARY_CASTERPAK_URL:-http://localhost}
      - CASTERPAK_LIBRARY_DATABASE_URL=sqlite:////var/lib/casterpak/library/library.db
      # Write where casterpak reads: same input type and locations as the casterpak service.
      - CASTERPAK_INPUT_INPUT_TYPE=${CASTERPAK_INPUT_INPUT_TYPE:-filesystem}
      - CASTERPAK_FILESYSTEM_VIDEOPARENTPATH=${CASTERPAK_FILESYSTEM_VIDEOPARENTPATH:-/mnt/data}
      - CASTERPAK_S3_BUCKET=${CASTERPAK_S3_BUCKET:-}
      - CASTERPAK_S3_PREFIX=${CASTERPAK_S3_PREFIX:-}
      - CASTERPAK_S3_REGION=${CASTERPAK_S3_REGION:-us-east-1}
      - CASTERPAK_S3_ENDPOINT_URL=${CASTERPAK_S3_ENDPOINT_URL:-}
    volumes:
      # Same host directory casterpak reads as /mnt/data - here writable, so uploads land in it.
      - ${HOST_VIDEO_PATH:-~/Videos}:/mnt/data
      - library_data:/var/lib/casterpak/library
    restart: unless-stopped

  nginx:
    build: 
      context: .
      dockerfile: ./nginx/Dockerfile
    image: flipmcf/casterpak-proxy:${CASTERPAK_VERSION:-0.9.1-alpha}
    container_name: casterpak_nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - casterpak
    volumes:
      # Casterpak will write to this same volume, nginx reads from it to serve segments.
      - ${HOST_CACHE_PATH:-/var/cache/casterpak}:/var/cache/casterpak:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro

    restart: unless-stopped

volumes:
  library_data:
    labels:
      com.openforgesolutions.description: "Library service database (users, upload records)"
  casterpak_data:
    labels:
      com.openforgesolutions.description: "Database"
      com.openforgesolutions.label: ""
  
