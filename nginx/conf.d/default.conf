#don't edit this file unless it's production config.  It will end up in the build.
# see 'config_overrides' for development config changes

include /etc/nginx/ssl/*.conf;

# Rate limit for the library's password-taking endpoints only. `map` gives every other
# request an empty key, and nginx does not rate-limit an empty key.
map $uri $library_auth_limit_key {
    default           "";
    /api/auth/login   $binary_remote_addr;
    /api/users        $binary_remote_addr;
}
limit_req_zone $library_auth_limit_key zone=library_auth:1m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    location / {
        proxy_pass http://casterpak:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        #we send the http/https protocol we got in a header
        # so that flask and casterpak can create manifest url's that match
        proxy_set_header X-Forwarded-Proto $scheme;

        include /etc/nginx/config_overrides/*.conf;
        
    }
    
    # The library service (user accounts, upload, listing) - a separate container, started with
    # `docker compose --profile library up`. Its address is resolved per request through
    # Docker's DNS, so nginx still starts, and streaming keeps working, when it is not running
    # (/api/ then simply answers 502).
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $library_upstream http://library:5001;
        proxy_pass $library_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        limit_req zone=library_auth burst=10 nodelay;

        # Uploads: keep above [library] max_upload_mb (config_example.ini).
        client_max_body_size 2100m;
        # Buffer the upload in nginx, so a slow client ties up nginx (cheap) rather than a
        # library worker (expensive). Overrides the server-wide `proxy_request_buffering off`.
        proxy_request_buffering on;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location /protected_media/ {
        # 'internal' means the outside internet gets a 404 if they try to access this path directly.
        # It can ONLY be triggered by Flask sending the X-Accel-Redirect header.
        internal;
        
        # This points to the actual disk mount point inside the Nginx container that it shares with casterpak (flask)
        alias /var/cache/casterpak/segments/;
        
        # Performance tuning for video delivery
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;

        # Ensure proper MIME type is served if Flask doesn't set it
        default_type video/MP2T;
        
        # CORS Headers: Required if the js video player is on a different domain
        add_header Access-Control-Allow-Origin *;
    }

    location /testing/ {
        alias /etc/nginx/html/testing/; 
        index test_player.html;
    }

    # Video Streaming Optimization
    proxy_buffering off;
    proxy_request_buffering off;
}
